apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: api-secrets
spec:
  refreshInterval: 15m
  secretStoreRef:
    name: smart-travel-vault
    kind: ClusterSecretStore
  target:
    name: api-secrets
    creationPolicy: Owner
    deletionPolicy: Delete
    template:
      type: Opaque
  data:
    - secretKey: SECRET_KEY
      remoteRef:
        key: smart-travel/api
        property: SECRET_KEY
    - secretKey: JWT_SECRET
      remoteRef:
        key: smart-travel/api
        property: JWT_SECRET
    - secretKey: GOOGLE_PLACES_API_KEY
      remoteRef:
        key: smart-travel/api
        property: GOOGLE_PLACES_API_KEY