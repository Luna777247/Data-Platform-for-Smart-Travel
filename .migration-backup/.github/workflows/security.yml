name: Security - Code Scanning

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 2 * * 0"  # Weekly scan at 2 AM UTC on Sunday

jobs:
  # ============================================================================
  # DEPENDENCY CHECK
  # ============================================================================
  dependency-check:
    name: Dependency Security Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif
          severity: "CRITICAL,HIGH"

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trivy-results.sarif
          wait-for-processing: true

  # ============================================================================
  # SECRET SCANNING
  # ============================================================================
  secret-scan:
    name: Secret Scanning
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --no-git --redact --source . --report-format sarif --report-path /tmp/gitleaks.sarif
        continue-on-error: true

      - name: Run TruffleHog
        uses: docker://trufflesecurity/trufflehog:latest
        with:
          args: filesystem . --no-update --fail --json
        continue-on-error: true

      - name: Run detect-secrets
        run: |
          pip install detect-secrets
          detect-secrets scan --baseline .secrets.baseline || true

  # ============================================================================
  # PYTHON SECURITY
  # ============================================================================
  bandit:
    name: Python Security (Bandit)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: pip install bandit

      - name: Run Bandit
        run: bandit -r apps/backend src -f sarif -o bandit-sarif.json
        continue-on-error: true

      - name: Upload Bandit results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: bandit-sarif.json
        if: always()

  # ============================================================================
  # CONTAINER IMAGE SCANNING
  # ============================================================================
  container-scan:
    name: Container Image Scanning
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Image for Scanning
        uses: docker/build-push-action@v4
        with:
          context: .
          dockerfile: infra/docker/Dockerfile.backend
          push: false
          load: true
          tags: smart-travel-backend:scan
          outputs: type=oci,dest=/tmp/backend-image

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: smart-travel-backend:scan
          format: sarif
          output: backend-image-scan.sarif
        continue-on-error: true

      - name: Upload Container Scan Results
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: backend-image-scan.sarif
        if: always()

  # ============================================================================
  # SBOM GENERATION
  # ============================================================================
  sbom:
    name: Generate SBOM (Software Bill of Materials)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install syft
        run: |
          curl -sSfL https://raw.githubusercontent.com/anchore/syft/main/install.sh | sh -s -- -b /usr/local/bin

      - name: Generate Python SBOM
        run: syft -o spdx-json apps/backend src > sbom-python.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v3
        with:
          name: sbom
          path: sbom-python.json

  # ============================================================================
  # CONFIGURATION SECURITY
  # ============================================================================
  config-audit:
    name: Configuration Audit
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Check for hardcoded secrets in files
        run: |
          echo "Checking for hardcoded secrets..."
          grep -r "password" apps/backend src infra --include="*.py" --include="*.yml" --include="*.yaml" || true
          grep -r "secret" apps/backend src infra --include="*.py" --include="*.yml" --include="*.yaml" || true
          grep -r "api.key" apps/backend src infra --include="*.py" --include="*.yml" --include="*.yaml" || true
          grep -r "envsubst" infra apps scripts .github --include="*.py" --include="*.yml" --include="*.yaml" --include="*.sh" --include="*.ps1" || true

      - name: Check docker-compose.yml for secrets
        run: |
          echo "Checking docker-compose files..."
          grep -r "secret_password" . || echo "✅ No hardcoded passwords found"
          grep -r "CHANGEME" . || echo "✅ No CHANGEME placeholders found"

  # ============================================================================
  # LICENSE CHECK
  # ============================================================================
  license-check:
    name: License Compliance
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        run: pip-audit --requirements apps/backend/requirements.txt || true

  # ============================================================================
  # CODEQL
  # ============================================================================
  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        language: [python, javascript]

    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}

      - name: Autobuild
        uses: github/codeql-action/autobuild@v2

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2
