# Development overrides for docker-compose.yml
version: '3.8'

services:
  backend:
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
    volumes:
      - ./apps/backend:/app
      - /app/__pycache__

  frontend:
    environment:
      - NODE_ENV=development
    volumes:
      - ./apps/frontend:/app
      - /app/node_modules
      - /app/.next

  airflow-webserver:
    environment:
      - AIRFLOW__CORE__LOGGING_LEVEL=DEBUG
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./logs:/opt/airflow/logs

  airflow-scheduler:
    environment:
      - AIRFLOW__CORE__LOGGING_LEVEL=DEBUG
    volumes:
      - ./dags:/opt/airflow/dags
      - ./src:/opt/airflow/src
      - ./logs:/opt/airflow/logs
