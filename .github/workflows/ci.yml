name: CI - Code Quality & Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================================================
  # PYTHON QUALITY CHECKS
  # ============================================================================
  python-lint:
    name: Python Lint & Type Check
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r apps/backend/requirements.txt

      - name: Run Black (Code Formatting Check)
        run: black --check apps/backend src tests

      - name: Run isort (Import Sorting Check)
        run: isort --check-only apps/backend src tests

      - name: Run flake8 (Linting)
        run: |
          flake8 apps/backend src tests --max-line-length=88 \
            --extend-ignore=E203,W503 \
            --exclude=__pycache__,*.egg-info

      - name: Run mypy (Type Checking)
        run: mypy apps/backend src --ignore-missing-imports --no-error-summary || true

  # ============================================================================
  # PYTHON TESTS
  # ============================================================================
  python-test:
    name: Python Tests
    runs-on: ubuntu-latest
    needs: python-lint

    services:
      mongodb:
        image: mongo:6.0
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        env:
          MONGO_INITDB_ROOT_USERNAME: ${{ secrets.CI_MONGODB_USER }}
          MONGO_INITDB_ROOT_PASSWORD: ${{ secrets.CI_MONGODB_PASSWORD }}
          MONGO_INITDB_DATABASE: smart_travel
        ports:
          - 27017:27017

      postgres:
        image: postgis/postgis:15-3.3
        env:
          POSTGRES_USER: ${{ secrets.CI_POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.CI_POSTGRES_PASSWORD }}
          POSTGRES_DB: smart_travel
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -r apps/backend/requirements.txt

      - name: Run pytest
        env:
          MONGODB_URI: mongodb://${{ secrets.CI_MONGODB_USER }}:${{ secrets.CI_MONGODB_PASSWORD }}@localhost:27017/smart_travel
          POSTGRES_URL: postgresql+asyncpg://${{ secrets.CI_POSTGRES_USER }}:${{ secrets.CI_POSTGRES_PASSWORD }}@localhost:5432/smart_travel
          REDIS_URL: redis://:${{ secrets.CI_REDIS_PASSWORD }}@localhost:6379/0
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          JWT_SECRET: ${{ secrets.CI_JWT_SECRET }}
          GOOGLE_PLACES_API_KEY: ${{ secrets.CI_GOOGLE_PLACES_API_KEY }}
        run: |
          pytest tests/ apps/backend/app/tests/ \
            --cov=src \
            --cov=apps/backend/app \
            --cov-report=term \
            --cov-report=xml \
            -v

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  # ============================================================================
  # SECURITY CHECKS
  # ============================================================================
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install bandit safety detect-secrets

      - name: Run Gitleaks
        uses: docker://ghcr.io/gitleaks/gitleaks:latest
        with:
          args: detect --no-git --redact --source . --report-format sarif --report-path /tmp/gitleaks.sarif
        continue-on-error: true

      - name: Run TruffleHog
        uses: docker://trufflesecurity/trufflehog:latest
        with:
          args: filesystem . --no-update --fail --json
        continue-on-error: true

      - name: Run Bandit (Security Check)
        run: bandit -r apps/backend src -f json -o bandit-report.json || true

      - name: Run Safety (Dependency Check)
        run: safety check --json || true

  # ============================================================================
  # DOCKER BUILD CHECK
  # ============================================================================
  docker-build:
    name: Docker Build Check
    runs-on: ubuntu-latest
    needs: [python-lint, python-test]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Backend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          dockerfile: infra/docker/Dockerfile.backend
          push: false
          tags: smart-travel-backend:ci-${{ github.sha }}

      - name: Build Frontend Docker Image
        uses: docker/build-push-action@v4
        with:
          context: ./apps/frontend
          dockerfile: apps/frontend/Dockerfile
          push: false
          tags: smart-travel-frontend:ci-${{ github.sha }}

      - name: Build Airflow Docker Image
        uses: docker/build-push-action@v4
        with:
          context: .
          dockerfile: infra/docker/Dockerfile.airflow
          push: false
          tags: smart-travel-airflow:ci-${{ github.sha }}

  # ============================================================================
  # FRONTEND CHECKS
  # ============================================================================
  frontend-lint:
    name: Frontend Lint
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/frontend/package-lock.json

      - name: Install dependencies
        working-directory: apps/frontend
        run: npm ci

      - name: Run ESLint
        working-directory: apps/frontend
        run: npm run lint

  # ============================================================================
  # DEPENDENCY CHECK
  # ============================================================================
  deps-check:
    name: Dependency Health Check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy results to GitHub Security tab
        uses: github/codeql-action/upload-sarif@v2
        with:
          sarif_file: trivy-results.sarif

  # ============================================================================
  # SUMMARY
  # ============================================================================
  ci-success:
    name: CI Pipeline Success
    runs-on: ubuntu-latest
    needs: [python-lint, python-test, security-scan, docker-build, frontend-lint, deps-check]
    if: success()

    steps:
      - name: ✅ CI Pipeline Passed
        run: echo "All CI checks passed successfully!"
