# Smart Tourism Data Platform - Docker Compose Configuration
# ===============================================================
# Orchestration cho tất cả services: API, Database, Cache, Monitoring
#
# Usage:
#     # Start tất cả services
#     docker-compose up -d
#     
#     # Xem logs
#     docker-compose logs -f api
#     
#     # Stop tất cả services
#     docker-compose down
#     
#     # Rebuild và restart
#     docker-compose up -d --build
#
# Services:
# - api: FastAPI application (port 8000)
# - mongodb: MongoDB database (port 27017)
# - redis: Redis cache (port 6379)
# - prometheus: Metrics collection (port 9090)
# - grafana: Monitoring dashboards (port 3001)
#
# Networks:
# - smart-tourism-network: Internal network cho service communication

version: "3.8"

services:
  # ============================================
  # FASTAPI APPLICATION
  # ============================================
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-tourism-api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      # Environment configuration
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO

      # MongoDB connection
      - MONGODB_HOST=mongodb
      - MONGODB_PORT=27017
      - MONGODB_DB=smart_travel
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/smart_travel?authSource=admin

      # Redis connection
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_DB=0
      - REDIS_URI=redis://redis:6379/0

      # Security (thay đổi trong production!)
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-your-secret-key-change-in-production}
      - JWT_ALGORITHMS=HS256
      - ACCESS_TOKEN_EXPIRE_MINUTES=30

      # CORS origins
      - CORS_ORIGINS=http://localhost:3000,http://localhost:8080
    env_file:
      - .env
    volumes:
      # Mount source code cho development (bỏ trong production)
      - ./src:/app/src:ro
      # Mount storage directory cho data persistence
      - ./storage:/app/storage
      # Mount logs
      - ./logs:/app/logs
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - smart-tourism-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # MONGODB DATABASE
  # ============================================
  mongodb:
    image: mongo:7.0
    container_name: smart-tourism-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:-admin}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:-admin123}
      - MONGO_INITDB_DATABASE=smart_travel
    volumes:
      # Persistent data storage
      - mongodb_data:/data/db
    networks:
      - smart-tourism-network
    healthcheck:
      test: ["CMD-SHELL", "pgrep mongod || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    # Sử dụng default MongoDB configuration
    # command: [ "mongod", "--config", "/etc/mongod.conf" ]

  # ============================================
  # REDIS CACHE
  # ============================================
  redis:
    image: redis:7.2-alpine
    container_name: smart-tourism-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      # Persistent Redis data
      - redis_data:/data
      # Redis configuration
      - ./deployment/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks:
      - smart-tourism-network
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    command: redis-server /usr/local/etc/redis/redis.conf

  # ============================================
  # PROMETHEUS - Metrics Collection
  # ============================================
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: smart-tourism-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      # Prometheus configuration
      - ./deployment/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # Alert rules
      - ./deployment/prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      # Persistent storage
      - prometheus_data:/prometheus
    networks:
      - smart-tourism-network
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--web.enable-lifecycle'
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # GRAFANA - Monitoring Dashboards
  # ============================================
  grafana:
    image: grafana/grafana:10.2.0
    container_name: smart-tourism-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin123}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_SERVER_ROOT_URL=http://localhost:3001
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      # Grafana configuration
      - ./deployment/grafana/grafana.ini:/etc/grafana/grafana.ini:ro
      # Dashboard provisioning
      - ./deployment/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      # Data source provisioning
      - ./deployment/grafana/datasources:/etc/grafana/provisioning/datasources:ro
      # Persistent storage
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - smart-tourism-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # CELERY WORKER - Background Tasks
  # ============================================
  celery-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-tourism-celery-worker
    restart: unless-stopped
    command: celery -A src.core.celery_app worker --loglevel=info --concurrency=4
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/smart_travel?authSource=admin
      - REDIS_URI=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - .env
    volumes:
      - ./src:/app/src:ro
      - ./storage:/app/storage
      - ./logs:/app/logs
    depends_on:
      - mongodb
      - redis
    networks:
      - smart-tourism-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  # ============================================
  # CELERY BEAT - Scheduler
  # ============================================
  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smart-tourism-celery-beat
    restart: unless-stopped
    command: celery -A src.core.celery_app beat --loglevel=info
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - MONGODB_URI=mongodb://admin:admin123@mongodb:27017/smart_travel?authSource=admin
      - REDIS_URI=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
    env_file:
      - .env
    volumes:
      - ./src:/app/src:ro
      - ./storage:/app/storage
      - ./logs:/app/logs
      # Persistent scheduler state
      - celery_beat_data:/var/run/celery
    depends_on:
      - mongodb
      - redis
    networks:
      - smart-tourism-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

# ============================================
# VOLUMES - Persistent Storage
# ============================================
volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  celery_beat_data:
    driver: local

# ============================================
# NETWORKS - Service Communication
# ============================================
networks:
  smart-tourism-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/16
