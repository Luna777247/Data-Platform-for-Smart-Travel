apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-travel-api
  labels:
    app: smart-travel-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smart-travel-api
  template:
    metadata:
      labels:
        app: smart-travel-api
    spec:
      containers:
      - name: api
        image: myorg/smart-travel-backend:latest
        ports:
        - containerPort: 8000
        env:
        - name: MONGODB_URI
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: mongodb-url
        - name: DB_NAME
          value: "smart_travel"
        - name: POSTGRES_URL
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: postgres-url
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: redis-url
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: smart-travel-api-service
  labels:
    app: smart-travel-api
spec:
  selector:
    app: smart-travel-api
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
