apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-travel-api
  labels:
    app: smart-travel-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: smart-travel-api
  template:
    metadata:
      labels:
        app: smart-travel-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: api
        image: myorg/smart-travel-backend:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
        env:
        - name: MONGODB_HOST
          value: "mongodb"
        - name: MONGODB_USER
          value: "admin"
        - name: DB_NAME
          value: "smart_travel"
        - name: POSTGRES_HOST
          value: "postgres"
        - name: POSTGRES_USER
          value: "admin"
        - name: POSTGRES_DB
          value: "smart_travel"
        - name: REDIS_HOST
          value: "redis"
        - name: REDIS_PORT
          value: "6379"
        - name: MINIO_ENDPOINT
          value: "minio:9000"
        - name: MINIO_SECURE
          value: "false"
        - name: DB_NAME
          value: "smart_travel"
        - name: ALLOWED_ORIGINS
          value: "https://smart-travel.example.com,https://admin.smart-travel.example.com"
        - name: ENVIRONMENT
          value: "production"
        - name: DEBUG
          value: "false"
        - name: ENABLE_HTTPS
          value: "true"
        - name: ACCESS_TOKEN_EXPIRE_MINUTES
          value: "30"
        - name: REFRESH_TOKEN_EXPIRE_DAYS
          value: "7"
        - name: MONGODB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: MONGODB_PASSWORD
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: POSTGRES_PASSWORD
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: REDIS_PASSWORD
        - name: MINIO_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: MINIO_ACCESS_KEY
        - name: MINIO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: db-secrets
              key: MINIO_SECRET_KEY
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: SECRET_KEY
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: JWT_SECRET
        - name: GOOGLE_PLACES_API_KEY
          valueFrom:
            secretKeyRef:
              name: api-secrets
              key: GOOGLE_PLACES_API_KEY
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
              - ALL
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/ready
            port: 8000
          initialDelaySeconds: 5
          periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: smart-travel-api-service
  labels:
    app: smart-travel-api
spec:
  selector:
    app: smart-travel-api
  ports:
  - port: 80
    targetPort: 8000
  type: ClusterIP
