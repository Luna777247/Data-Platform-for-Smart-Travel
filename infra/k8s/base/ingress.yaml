apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-travel-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: smart-travel.example.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: smart-travel-frontend-service
            port:
              number: 80
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: smart-travel-api-service
            port:
              number: 80
