version: '3.8'

services:
  # 1. DATABASE LAYER: PostgreSQL + PostGIS
  db:
    image: postgis/postgis:15-3.3
    container_name: smart_tourism_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: smart_tourism
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d smart_tourism" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. STORAGE LAYER: MinIO (S3 Compatible)
  minio:
    image: minio/minio
    container_name: smart_tourism_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # 3. TRANSFORMATION LAYER: Redis (for caching)
  cache:
    image: redis:7-alpine
    container_name: smart_tourism_cache
    ports:
      - "6379:6379"

volumes:
  postgres_data:
  minio_data:
