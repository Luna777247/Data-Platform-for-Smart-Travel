services:
  # 1. DATABASE LAYER: PostgreSQL + PostGIS
  db:
    image: postgis/postgis:15-3.3
    container_name: smart_tourism_db
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secret_password
      POSTGRES_DB: smart_tourism
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U admin -d smart_tourism" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 2. STORAGE LAYER: MinIO (S3 Compatible)
  minio:
    image: minio/minio
    container_name: smart_tourism_minio
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadminpassword
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:9000/minio/health/live" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # 4. NOSQL LAYER: MongoDB
  mongodb:
    image: mongo:6.0
    container_name: smart_tourism_mongo
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: secret_password
      MONGO_INITDB_DATABASE: smart_travel
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username admin --password secret_password --authenticationDatabase admin --eval \"db.adminCommand({ ping: 1 }).ok\" | grep 1"
        ]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # 5. ORCHESTRATION LAYER: Apache Airflow
  airflow-webserver:
    image: apache/airflow:2.7.2
    container_name: smart_tourism_airflow_webserver
    depends_on:
      db:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:secret_password@db:5432/smart_tourism
      - AIRFLOW__CORE__FERNET_KEY=fb7q_f9_p2V64Z8f8f8f8f8f8f8f8f8f8f8f8f8f8f8=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      - _PIP_ADDITIONAL_DEPENDENCIES=httpx requests motor pymongo
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    ports:
      - "8080:8080"
    command: webserver
    healthcheck:
      test: [ "CMD", "curl", "--fail", "http://localhost:8080/health" ]
      interval: 10s
      timeout: 10s
      retries: 5
    restart: unless-stopped

  airflow-scheduler:
    image: apache/airflow:2.7.2
    container_name: smart_tourism_airflow_scheduler
    depends_on:
      db:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:secret_password@db:5432/smart_tourism
      - AIRFLOW__CORE__FERNET_KEY=fb7q_f9_p2V64Z8f8f8f8f8f8f8f8f8f8f8f8f8f8f8=
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session
      - _PIP_ADDITIONAL_DEPENDENCIES=httpx requests motor pymongo
    volumes:
      - ./dags:/opt/airflow/dags
      - ./logs:/opt/airflow/logs
      - ./plugins:/opt/airflow/plugins
    command: scheduler
    restart: unless-stopped

  airflow-init:
    image: apache/airflow:2.7.2
    container_name: smart_tourism_airflow_init
    depends_on:
      db:
        condition: service_healthy
    environment:
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://admin:secret_password@db:5432/smart_tourism
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
    entrypoint: /bin/bash
    command:
      - -c
      - |
        airflow db init &&
        airflow users create \
          --username admin \
          --firstname admin \
          --lastname admin \
          --role Admin \
          --email admin@example.com \
          --password admin
    restart: "no"
  # 6. FRONTEND LAYER: Next.js Dashboard
  frontend:
    build:
      context: ../apps/frontend
      dockerfile: Dockerfile
    container_name: smart_tourism_frontend
    ports:
      - "3001:3001"
    environment:
      - NEXT_PUBLIC_API_BASE_URL=http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    restart: always
    healthcheck:
      test: [ "CMD", "wget", "--spider", "-q", "http://localhost:3001" ]
      interval: 10s
      timeout: 10s
      retries: 10

  # 7. BACKEND LAYER: FastAPI
  backend:
    build:
      context: ../apps/backend
      dockerfile: Dockerfile
    container_name: smart_tourism_backend
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://admin:secret_password@mongodb:27017/smart_travel?authSource=admin
      - MINIO_ENDPOINT=minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadminpassword
      - AIRFLOW_URL=http://airflow-webserver:8080/api/v1
      - APP_ENV=production
      - LOG_LEVEL=info
    depends_on:
      mongodb:
        condition: service_healthy
      minio:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=2).read()\""
        ]
      interval: 10s
      timeout: 10s
      retries: 10
    restart: unless-stopped

  # 8. MONITORING: Prometheus + Alertmanager + cAdvisor
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: smart_tourism_prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alert.rules.yml:/etc/prometheus/alert.rules.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: smart_tourism_alertmanager
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    restart: unless-stopped

volumes:
  postgres_data:
  minio_data:
  mongo_data:
  prometheus_data:

