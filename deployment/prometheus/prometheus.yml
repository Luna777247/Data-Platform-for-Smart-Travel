# Smart Tourism Data Platform - Prometheus Configuration
# =======================================================
# Configuration cho Prometheus metrics collection
#
# Mục đích:
# - Scrape metrics từ FastAPI application
# - Monitor system performance
# - Alert rules cho critical issues
#
# Targets:
# - api:8000: FastAPI application metrics
# - mongodb: MongoDB exporter metrics (nếu có)
# - redis: Redis exporter metrics (nếu có)
# - node: Node exporter cho system metrics

# ============================================================================
# GLOBAL CONFIGURATION
# ============================================================================
global:
  # scrape_interval: Tần suất scrape metrics (default: 15s)
  scrape_interval: 15s
  
  # evaluation_interval: Tần suất evaluate rules (default: 15s)
  evaluation_interval: 15s
  
  # external_labels: Labels được attach vào tất cả alerts và remote writes
  external_labels:
    # Cluster identifier
    cluster: 'smart-tourism'
    # Environment label
    environment: 'production'
    # Replica identifier (cho HA setups)
    replica: '{{.ExternalURL}}'

# ============================================================================
# ALERTING
# ============================================================================
alerting:
  alertmanagers:
    # Alertmanager chưa được deploy - để trống
    - static_configs:
        - targets: []

# ============================================================================
# RULE FILES
# ============================================================================
# Load alerting rules từ files
rule_files:
  # Application alerts (pipeline failures, API errors)
  - 'alerts.yml'
  # Có thể thêm nhiều rule files
  # - 'infrastructure_alerts.yml'
  # - 'business_alerts.yml'

# ============================================================================
# SCRAPE CONFIGURATIONS
# ============================================================================
scrape_configs:
  
  # --------------------------------------------------------------------------
  # PROMETHEUS SELF-MONITORING
  # --------------------------------------------------------------------------
  - job_name: 'prometheus'
    
    # Override global scrape_interval
    scrape_interval: 15s
    
    # Metrics path (default: /metrics)
    metrics_path: '/metrics'
    
    # Scrape targets
    static_configs:
      - targets:
          - 'localhost:9090'
    
  
  # --------------------------------------------------------------------------
  # FASTAPI APPLICATION
  # --------------------------------------------------------------------------
  - job_name: 'smart-tourism-api'
    
    # Scrape interval cho API metrics
    scrape_interval: 10s
    
    # Timeout cho scrape requests
    scrape_timeout: 5s
    
    # Metrics endpoint của FastAPI app
    metrics_path: '/metrics'
    
    # Static targets (trong Docker network)
    static_configs:
      - targets:
          - 'api:8000'  # Service name trong docker-compose network
        labels:
          service: 'api'
          tier: 'application'
          language: 'python'
    
    # Relabel configs để modify labels
    relabel_configs:
      # Drop unnecessary labels
      - regex: '(.+)'
        action: labeldrop
        # Giữ lại các labels quan trọng
  
  # --------------------------------------------------------------------------
  # MONGODB METRICS - disabled (mongodb-exporter not deployed)
  # --------------------------------------------------------------------------
  # - job_name: 'mongodb'
  #   static_configs:
  #     - targets: ['mongodb-exporter:9216']
  
  # --------------------------------------------------------------------------
  # REDIS METRICS - disabled (redis-exporter not deployed)
  # --------------------------------------------------------------------------
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['redis-exporter:9121']
  
  # --------------------------------------------------------------------------
  # NODE EXPORTER - disabled (node-exporter not deployed)
  # --------------------------------------------------------------------------
  # - job_name: 'node-exporter'
  #   static_configs:
  #     - targets: ['node-exporter:9100']
  
  # --------------------------------------------------------------------------
  # DOCKER METRICS - disabled (docker-exporter not deployed)
  # --------------------------------------------------------------------------
  # - job_name: 'docker'
  #   static_configs:
  #     - targets: ['docker-exporter:9323']
  
  # --------------------------------------------------------------------------
  # CELERY METRICS - disabled (celery-exporter not deployed)
  # --------------------------------------------------------------------------
  # - job_name: 'celery'
  #   static_configs:
  #     - targets: ['celery-exporter:9808']

