#     
#     # Queue config
#     queue_config:
#       capacity: 10000
#       max_samples_per_send: 1000
#       max_shards: 200

# ============================================================================
# REMOTE READ (Optional - cho external storage)
# ============================================================================
# remote_read:
#   - url: 'https://prometheus-remote-read.example.com/api/v1/read'
#     
#     basic_auth:
#       username: 'prometheus'
#       password_file: '/etc/prometheus/remote_read_password'
#     
#     read_recent: true

# ============================================================================
# STORAGE CONFIGURATION
# ============================================================================
storage:
  # Time series retention (15 ngày cho development, 30+ cho production)
  tsdb:
    retention.time: 15d
    
    # Retention size (500MB default, tăng cho production)
    retention.size: 2GB
    
    # Wal compression
    wal-compression: true

# ============================================================================
# QUERY CONFIGURATION
# ============================================================================
# Query settings cho PromQL queries
query:
  # Timeout cho queries
  timeout: 2m
  
  # Max concurrency
  max-concurrency: 20

# ============================================================================
# RULES EVALUATION
# ============================================================================
# Cấu hình cho rule evaluation
rule_query_offset: 1m

# ============================================================================
# TRACING (Experimental)
# ============================================================================
# tracing:
#   # Jaeger hoặc OTLP endpoint
#   endpoint: 'jaeger:14268'
#   client_type: 'http'
#   service_name: 'prometheus'

# ============================================================================
# NOTES
# ============================================================================
# 1. Trong Docker, dùng service names (api, mongodb, redis) làm targets
# 2. Cần setup exporters (mongodb-exporter, redis-exporter) để có metrics
# 3. Alertmanager cần được cấu hình riêng cho alerting
# 4. Remote write/read optional cho long-term storage
# ============================================================================
