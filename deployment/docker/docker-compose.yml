
# Smart Travel Data Platform - Base Docker Compose
#
# Usage:
#   Local dev:     docker-compose up -d
#   Production:    docker-compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  # ============================================================================
  # DATABASE LAYER
  # ============================================================================
  mongodb:
    image: mongo:6.0
    container_name: smart_travel_mongodb
    restart: always
    networks:
      - smart_travel
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGODB_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGODB_PASSWORD:?MongoDB password required}
      MONGO_INITDB_DATABASE: ${MONGODB_DATABASE:-smart_travel}
    ports:
      - "${MONGODB_PORT:-27017}:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    healthcheck:
      test: [ "CMD", "mongosh", "--eval", "db.adminCommand('ping')" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  postgres:
    image: postgis/postgis:15-3.3
    container_name: smart_travel_postgres
    restart: always
    networks:
      - smart_travel
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?PostgreSQL password required}
      POSTGRES_DB: ${POSTGRES_DB:-smart_travel}
      POSTGRES_INITDB_ARGS: "-c shared_preload_libraries=pg_stat_statements"
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin}" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  redis:
    image: redis:7-alpine
    container_name: smart_travel_redis
    restart: always
    networks:
      - smart_travel
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: >
      redis-server --requirepass ${REDIS_PASSWORD:?Redis password required} --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  minio:
    image: minio/minio:RELEASE.2026-01-26T00-23-51Z
    container_name: smart_travel_minio
    restart: always
    networks:
      - smart_travel
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:?MinIO access key required}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MinIO secret key required}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data

  # ============================================================================
  # API LAYER
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.backend
    container_name: smart_travel_backend
    restart: always
    networks:
      - smart_travel
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      # Database
      MONGODB_URI: mongodb://${MONGODB_USER:-admin}:${MONGODB_PASSWORD:?}@mongodb:27017
      MONGODB_DATABASE: ${MONGODB_DATABASE:-smart_travel}
      POSTGRES_URL: postgresql+asyncpg://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-smart_travel}
      REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0

      # Application
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SECRET_KEY: ${SECRET_KEY:?Application secret key required}
      JWT_SECRET: ${JWT_SECRET:?JWT secret required}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}

      # External APIs
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:?Google API key required}

      # Object Storage
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MinIO access key required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MinIO secret key required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_SECURE: ${MINIO_SECURE:-false}

      # CORS
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000}

      # Rate Limiting
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_REQUESTS_PER_MINUTE: ${RATE_LIMIT_REQUESTS_PER_MINUTE:-60}
    volumes:
      - ./apps/backend:/app
      - ./src:/app/src
    depends_on:
      mongodb:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    healthcheck:
      test: [ "CMD", "python", "-c", "import httpx; r = httpx.get('http://localhost:8000/api/health'); exit(0 if r.status_code==200 else 1)" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # FRONTEND LAYER
  # ============================================================================
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: smart_travel_frontend
    restart: always
    networks:
      - smart_travel
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000/api}
    depends_on:
      - backend
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ============================================================================
  # ORCHESTRATION LAYER (Apache Airflow)
  # ============================================================================
  airflow-webserver:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.airflow
    container_name: smart_travel_airflow_webserver
    restart: always
    networks:
      - smart_travel
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-smart_travel}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Airflow Fernet key required}
      AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET:?Airflow webserver secret required}
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: "False"
      AIRFLOW__CORE__LOGGING_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /opt/airflow:/opt/airflow/src
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MinIO access key required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MinIO secret key required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    ports:
      - "${AIRFLOW_WEBSERVER_PORT:-8080}:8080"
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_started
    command: webserver
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8080/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  airflow-scheduler:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.airflow
    container_name: smart_travel_airflow_scheduler
    restart: always
    networks:
      - smart_travel
    environment:
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql://${POSTGRES_USER:-admin}:${POSTGRES_PASSWORD:?}@postgres:5432/${POSTGRES_DB:-smart_travel}
      AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:?Airflow Fernet key required}
      AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
      AIRFLOW__CORE__LOAD_EXAMPLES: "False"
      AIRFLOW__CORE__LOAD_DEFAULT_CONNECTIONS: "False"
      AIRFLOW__CORE__LOGGING_LEVEL: ${LOG_LEVEL:-INFO}
      PYTHONPATH: /opt/airflow:/opt/airflow/src
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?MinIO access key required}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?MinIO secret key required}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-minio:9000}
      MINIO_SECURE: ${MINIO_SECURE:-false}
    volumes:
      - ./dags:/opt/airflow/dags:ro
      - ./src:/opt/airflow/src:ro
      - airflow_logs:/opt/airflow/logs
    depends_on:
      postgres:
        condition: service_healthy
      airflow-webserver:
        condition: service_healthy
      minio:
        condition: service_started
    command: scheduler

  # ============================================================================
  # REVERSE PROXY LAYER (NGINX)
  # ============================================================================
  nginx:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile.nginx
    container_name: smart_travel_nginx
    restart: always
    networks:
      - smart_travel
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - nginx_cache:/var/cache/nginx
      #      - /etc/ssl/certs/smart_travel.crt:/etc/nginx/ssl/cert.crt:ro
      #      - /etc/ssl/private/smart_travel.key:/etc/nginx/ssl/private.key:ro
      - certbot_data:/var/www/certbot:ro
    depends_on:
      - backend
      - frontend
      - airflow-webserver
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost/health-check" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# ============================================================================
# NETWORKS
# ============================================================================
networks:
  smart_travel:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

# ============================================================================
# VOLUMES
# ============================================================================
volumes:
  nginx_cache:
    driver: local
  certbot_data:
    driver: local
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
  postgres_data:
    driver: local
  redis_data:
    driver: local
  airflow_logs:
    driver: local
