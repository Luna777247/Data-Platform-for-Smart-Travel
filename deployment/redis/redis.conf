# Smart Tourism Data Platform - Redis Configuration
# ================================================
# Configuration cho Redis cache và message broker
#
# Mục đích:
# - Session cache cho API
# - Celery message broker
# - Rate limiting counters
# - Real-time data caching
#
# Usage:
#   redis-server /path/to/redis.conf

# ============================================================================
# NETWORK CONFIGURATION
# ============================================================================

# Bind address (0.0.0.0 cho Docker, 127.0.0.1 cho local)
# Trong Docker container, bind tất cả interfaces
bind 0.0.0.0

# Port (default: 6379)
port 6379

# TCP listen() backlog (default: 511)
tcp-backlog 511

# Unix socket (optional, disabled trong Docker)
# unixsocket /tmp/redis.sock
# unixsocketperm 700

# TCP keepalive (300 seconds)
# Giúp detect dead peers
tcp-keepalive 300

# ============================================================================
# SECURITY
# ============================================================================

# Require password (REQUIRED cho production)
# Trong production, set strong password
# requirepass your_strong_password_here

# Command renaming (security hardening)
# Rename dangerous commands
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command DEBUG ""

# Protected mode (enabled trong production)
# Chỉ accept connections từ localhost hoặc có password
protected-mode no

# ============================================================================
# GENERAL SETTINGS
# ============================================================================

# Run as daemon (no cho Docker - cần foreground process)
daemonize no

# PID file
# pidfile /var/run/redis_6379.pid

# Log level (debug, verbose, notice, warning)
# Production: notice or warning
loglevel notice

# Log file (empty string = stdout, phù hợp cho Docker)
logfile ""

# Syslog logging
# syslog-enabled no
# syslog-ident redis
# syslog-facility local0

# Database count (default: 16)
# Có thể dùng các db khác nhau cho cache, sessions, Celery
databases 16

# ============================================================================
# PERSISTENCE (RDB & AOF)
# ============================================================================

# RDB Persistence (Snapshotting)
# Lưu snapshots theo schedule

# Save sau 900s (15 phút) nếu có ít nhất 1 key change
save 900 1

# Save sau 300s (5 phút) nếu có ít nhất 10 key changes
save 300 10

# Save sau 60s (1 phút) nếu có ít nhất 10000 key changes
save 60 10000

# Stop writes nếu RDB snapshot fails (production)
stop-writes-on-bgsave-error yes

# Compress RDB files (yes cho disk space, no cho CPU)
rdbcompression yes

# Checksum RDB files (yes cho integrity)
rdbchecksum yes

# RDB file name
dbfilename dump.rdb

# Directory cho RDB và AOF
# Trong Docker, mount volume vào /data
dir /data

# AOF Persistence (Append Only File)
# Lưu tất cả write operations

# Enable AOF (recommended cho durability)
appendonly yes

# AOF file name
appendfilename "appendonly.aof"

# Fsync policy:
# always: fsync mỗi write (safest, slowest)
# everysec: fsync mỗi giây (default, good balance)
# no: fsync tùy OS (fastest, risky)
appendfsync everysec

# Fsync during rewrite (yes cho consistency)
no-appendfsync-on-rewrite no

# AOF rewrite triggers
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# AOF rewrite incremental fsync
aof-rewrite-incremental-fsync yes

# Load truncated AOF (yes cho recovery)
aof-load-truncated yes

# AOF use RDB preamble (yes cho faster rewrites)
aof-use-rdb-preamble yes

# ============================================================================
# MEMORY MANAGEMENT
# ============================================================================

# Max memory limit (set theo available RAM)
# Trong Docker container, set tùy theo container memory limit
# maxmemory 256mb

# Max memory policy khi đầy:
# - noeviction: Return errors (default)
# - allkeys-lru: Evict least recently used keys
# - allkeys-lfu: Evict least frequently used keys
# - allkeys-random: Evict random keys
# - volatile-lru: Evict LRU từ keys có expire
# - volatile-lfu: Evict LFU từ keys có expire
# - volatile-random: Evict random từ keys có expire
# - volatile-ttl: Evict keys có TTL ngắn nhất
maxmemory-policy allkeys-lru

# Max memory samples (LRU/LFU accuracy)
maxmemory-samples 5

# ============================================================================
# CLIENT CONNECTIONS
# ============================================================================

# Max client connections (10000 default)
# Tăng nếu có nhiều concurrent clients
maxclients 10000

# Client timeout (0 = không timeout)
timeout 0

# Client output buffer limits
# client-output-buffer-limit normal 0 0 0
# client-output-buffer-limit replica 256mb 64mb 60
# client-output-buffer-limit pubsub 32mb 8mb 60

# ============================================================================
# LAZY FREEING
# ============================================================================

# Async delete cho non-blocking DEL/FLUSH
lazyfree-lazy-eviction no
lazyfree-lazy-expire no
lazyfree-lazy-server-del no
replica-lazy-flush no
lazyfree-lazy-user-del no

# ============================================================================
# KERNEL SETTINGS
# ============================================================================

# Transparent Huge Pages (THP) warning
# THP có thể gây latency spikes
# Tắt THP: echo never > /sys/kernel/mm/transparent_hugepage/enabled

# ============================================================================
# SLOW LOG
# ============================================================================

# Slow query log threshold (microseconds)
slowlog-log-slower-than 10000

# Slow query log max length
slowlog-max-len 128

# ============================================================================
# LATENCY MONITOR
# ============================================================================

# Latency monitoring threshold (milliseconds)
latency-monitor-threshold 0

# ============================================================================
# EVENT NOTIFICATION
# ============================================================================

# Keyspace events notification
# notify-keyspace-events ""

# ============================================================================
# ADVANCED CONFIGURATION
# ============================================================================

# Hash max ziplist entries (compression)
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# List max ziplist entries
list-max-ziplist-size -2

# Set max intset entries
set-max-intset-entries 512

# Zset max ziplist entries
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# Hyperloglog max ziplist entries
hll-sparse-max-bytes 3000

# Stream node max bytes
stream-node-max-bytes 4096
stream-node-max-entries 100

# Active rehashing
activerehashing yes

# Client output buffer hard limit
client-output-buffer-limit normal 0 0 0

# ============================================================================
# TLS/SSL (Production)
# ============================================================================
# port 0  # Disable non-TLS port khi dùng TLS
# tls-port 6379
# tls-cert-file /path/to/redis.crt
# tls-key-file /path/to/redis.key
# tls-ca-cert-file /path/to/ca.crt
# tls-protocols "TLSv1.2 TLSv1.3"

# ============================================================================
# DOCKER-SPECIFIC
# ============================================================================

# Disable THP warning (THP usually disabled trong containers)
# ignore-warnings ARM64-COW-BUG

# ============================================================================
# NOTES
# ============================================================================
# 1. Trong Docker, dùng volume mount cho /data để persist RDB/AOF
# 2. Set requirepass trong production
# 3. Monitor memory usage và adjust maxmemory
# 4. Enable AOF cho durability, RDB cho backups
# 5. Use maxmemory-policy phù hợp với use case
# ============================================================================
